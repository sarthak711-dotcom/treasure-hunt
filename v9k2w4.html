<style>

:root{--bg:#0b0f2b;--card:#1c203b;--ink:#ede4d3;--mu:#b3b2c5;--li:rgba(237,228,211,.16);--mag:#ff3d7f;--bad:#ff6568;--a:#FFD166;--g:rgba(255,61,127,0.35);--e:cubic-bezier(.22,1,.36,1);
--fd:Anton,Impact,"Avenir Next Condensed","Arial Narrow",sans-serif-condensed,"Roboto Condensed",sans-serif;
--fb:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--fm:"Space Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:center;padding:32px 20px;color:var(--mu);font:400 1.05rem/1.55 var(--fb);-webkit-font-smoothing:antialiased;
background:radial-gradient(90% 45% at 90% -5%,var(--g),transparent 70%),radial-gradient(70% 40% at 0% 105%,rgba(138,92,255,.2),transparent 70%),radial-gradient(60% 35% at 100% 100%,rgba(255,61,127,.12),transparent 70%),var(--bg)}
body:before,body:after{content:"";position:fixed;pointer-events:none}
body:before{inset:0;opacity:.5;background:radial-gradient(circle,#ede4d3 .7px,transparent 1.3px) 0 0/97px 97px,radial-gradient(circle,#e6dff6 .5px,transparent 1.1px) 40px 60px/61px 61px;animation:tw 5s ease-in-out infinite alternate}
body:after{inset:10px;border:1px solid rgba(192,192,192,.2)}
main{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .7rem/1 var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.br{display:flex;align-items:center;gap:10px}
.dm{width:11px;height:11px;background:var(--mag);transform:rotate(45deg);box-shadow:0 0 14px var(--mag)}
.ch{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--li);border-radius:999px;color:var(--a);background:rgba(11,15,43,.6)}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}
.k{margin-top:10px;font:400 .68rem/1 var(--fm);letter-spacing:.22em;text-transform:uppercase}
h1{color:var(--ink);font:700 clamp(2.3rem,11vw,3.3rem)/.98 var(--fd);font-synthesis:none;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
h1:after{content:"";display:block;width:58px;height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--a),var(--mag))}
.cd{background:linear-gradient(180deg,rgba(28,32,59,.94),rgba(28,32,59,.78));border:1px solid var(--li);border-radius:.75rem;padding:20px}
.lb{display:block;margin-bottom:12px;color:var(--a);font:700 .66rem/1 var(--fm);letter-spacing:.2em;text-transform:uppercase}
.rd{color:#e6dff6;white-space:pre-wrap}
#code{display:block;width:100%;height:76px;padding:0;text-align:center;text-indent:.55em;letter-spacing:.55em;color:var(--ink);font:700 2.5rem/1 var(--fm);background:rgba(11,15,43,.75);border:2px solid var(--li);border-radius:.75rem;outline:0;caret-color:var(--a);transition:border-color .2s,box-shadow .2s}
#code::placeholder{color:rgba(237,228,211,.22)}
#code:focus{border-color:var(--a);box-shadow:0 0 0 4px var(--g)}
#code.bad{border-color:var(--bad);animation:sh .45s var(--e)}
#code:disabled{opacity:.6}
.bt{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:14px;padding:0 20px;border:0;border-radius:999px;background:var(--a);color:var(--bg);font:700 .92rem/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 12px 30px -12px var(--a);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .2s var(--e),opacity .2s}
.bt:active{transform:scale(.97)}
.bt:disabled{opacity:.55;cursor:default;box-shadow:none}
.bt:focus-visible,#code:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
#bar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--bg);opacity:.4;transform:scaleX(0);transform-origin:left}
.wt #bar{animation:cb 2s linear forwards}
#msg{min-height:1.5em;margin-top:12px;text-align:center;color:var(--bad);font:400 .8rem/1.5 var(--fm)}
#win{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a),0 24px 60px -24px var(--a);animation:in .7s var(--e) both}
#clue{color:var(--ink);font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere}
#clue:empty{display:none}
.pz{margin-top:18px;padding-top:16px;border-top:1px dashed var(--li);animation:in .5s var(--e) both}
.pzh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:12px;font:700 .68rem/1.2 var(--fm);letter-spacing:.04em;text-transform:uppercase;flex-wrap:nowrap}
.pzt{color:var(--a);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.pzs{color:var(--mu);font:400 .62rem/1.2 var(--fm);white-space:nowrap;letter-spacing:.03em;opacity:.85;flex-shrink:0}
.pzw{border-radius:.5rem;overflow:hidden;border:2px solid var(--li);background:#050714;margin-bottom:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.pzi{width:100%;height:auto;max-height:300px;object-fit:contain;display:block;touch-action:manipulation}
.pzhnt{text-align:center;font:400 .62rem/1.4 var(--fm);color:var(--mu);margin-bottom:10px;opacity:.85}
.pzb{background:rgba(237,228,211,.1);border:1px solid var(--li);color:var(--ink);box-shadow:none;min-height:50px;font-size:.82rem}
.pzb:active{background:var(--a);color:var(--bg)}
.mzw{border-radius:.5rem;overflow:hidden;border:2px solid var(--li);background:#050714;margin-top:14px;box-shadow:0 8px 24px -8px rgba(0,0,0,.6);animation:in .5s var(--e) both}
.mzi{width:100%;height:auto;max-height:360px;object-fit:contain;display:block;margin:0 auto}
footer{text-align:center;opacity:.7;font:400 .6rem/1.6 var(--fm);letter-spacing:.2em;text-transform:uppercase}
@keyframes sh{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes cb{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes tw{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,:before{animation:none!important;transition:none!important}}

</style></head>
